:: The canonical PDP-11 build-time test delegates to the detailed DMV
:: regression fixture.  Keeping the device-specific checks in their own file
:: makes the scope and evidence easy to review while ensuring that `make pdp11`
:: cannot silently omit them.
::
:: These checks cover the modeled host-visible DMV behavior.  They do not claim
:: to validate the card's 6502 firmware, ROM contents, MOP, or multipoint mode.

do PDP11/tests/pdp11_dmv_test.ini
